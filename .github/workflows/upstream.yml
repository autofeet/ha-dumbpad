name: Publish tested official DumbPad updates
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dumbpad-upstream-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g pnpm@11.25.0 --ignore-scripts
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: python3 -m unittest discover -s tests -v
      - name: Select stable official update
        id: upstream
        run: python3 scripts/check_upstream.py --apply
      - name: Build candidate
        if: steps.upstream.outputs.new_version != ''
        run: docker build --pull -t ha-dumbpad:update dumbpad
      - name: Check real authentication and persistence
        if: steps.upstream.outputs.new_version != ''
        run: python3 scripts/smoke_test.py ha-dumbpad:update
      - name: Check current upstream DOM compatibility
        if: steps.upstream.outputs.new_version != ''
        run: DUMBPAD_HTML_FIXTURE=test-results/current.html pnpm test
      - name: Publish tested version
        if: steps.upstream.outputs.new_version != ''
        env:
          NEW_VERSION: ${{ steps.upstream.outputs.new_version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dumbpad/Dockerfile dumbpad/config.json dumbpad/upstream.json dumbpad/CHANGELOG.md
          git commit -m "Update tested DumbPad image to $NEW_VERSION"
          git push origin HEAD:main
